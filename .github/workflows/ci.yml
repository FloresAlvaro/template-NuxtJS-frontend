name: Frontend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Verify public SSR during an API outage
        env:
          PORT: '4317'
          HOST: 127.0.0.1
          NUXT_BACKEND_API_BASE: http://127.0.0.1:1/api
        run: |
          node .output/server/index.mjs > /tmp/frontend-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent http://127.0.0.1:4317/login --output /tmp/frontend-login.html; then
              node scripts/check-public-ssr.mjs
              exit 0
            fi
            sleep 1
          done
          cat /tmp/frontend-ci.log
          exit 1
      - name: Build and verify the read-only non-root Docker runtime
        run: |
          docker build --tag tienda-frontend-ci .
          docker run --detach --name tienda-frontend-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,size=128m,mode=1777 \
            --publish 127.0.0.1:4318:3000 \
            --env NUXT_BACKEND_API_BASE=http://127.0.0.1:1/api tienda-frontend-ci
          for attempt in $(seq 1 30); do
            if curl --silent http://127.0.0.1:4318/login --output /dev/null; then
              SSR_BASE_URL=http://127.0.0.1:4318 node scripts/check-public-ssr.mjs
              exit 0
            fi
            sleep 1
          done
          docker logs tienda-frontend-ci
          exit 1
      - name: Clean up the Docker runtime
        if: always()
        run: docker rm --force tienda-frontend-ci 2>/dev/null || true
